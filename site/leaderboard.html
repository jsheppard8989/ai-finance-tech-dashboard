<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Game · Scarcity &amp; Abundance</title>
  <!-- Placeholder leaderboard (plumbing). G(ai)ndolf's front end replaces this page; data contract: data/leaderboard.json -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; color: #e8e8e8; line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; padding: 1rem; }
    a { color: #00d4ff; text-decoration: none; } a:hover { text-decoration: underline; }
    header { padding: 1.25rem 0 0.75rem; }
    h1 { font-size: 1.6rem; color: #fff; }
    .muted { color: #8892b0; font-size: 0.85rem; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem; margin: 1rem 0; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 0.5rem 0.55rem; border-bottom: 1px solid rgba(255,255,255,0.08); vertical-align: top; }
    th { color: #8892b0; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .up { color: #4ade80; } .down { color: #f87171; }
    .trade { font-size: 0.8rem; color: #a8b2d1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <p class="muted"><a href="index.html">← Back to home</a></p>
      <h1>Bot Game leaderboard</h1>
      <p class="muted" id="lb-meta">Loading…</p>
    </header>
    <div class="card">
      <table id="lb-table">
        <thead><tr><th>#</th><th>Bot</th><th class="num">Balance</th><th class="num">P&amp;L</th><th>Position</th><th>Today</th><th class="num">Fines</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="muted" id="lb-disclaimer"></p>
  </div>
  <script>
  (function () {
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function money(v) { return v == null ? '—' : '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
    function signed(v, suffix) { if (v == null) return '—'; var n = Number(v); return (n > 0 ? '+' : '') + n.toFixed(2) + (suffix || ''); }
    fetch('./data/leaderboard.json?v=' + Date.now(), {cache: 'no-cache'}).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('lb-meta').textContent = (d.game || 'Bot game') + (d.week ? ' · ' + d.week : '') +
        ' · Close marks as of ' + (d.as_of || '—') + ' · Scorekeeper: ' + (d.scorekeeper || 'Watcher') +
        ' · Start ' + money(d.starting_balance_usd);
      document.getElementById('lb-disclaimer').textContent = d.disclaimer || '';
      var tb = document.querySelector('#lb-table tbody');
      tb.innerHTML = (d.bots || []).map(function (b) {
        var cls = b.pnl_usd > 0 ? 'up' : (b.pnl_usd < 0 ? 'down' : '');
        var p = b.position || {};
        var pos = p.side === 'flat' ? 'Flat (cash)' : (p.ticker ? esc(p.ticker) + ' ' + esc(p.side || '') : '—');
        var trades = (b.today_trades || []).map(function (t) {
          return '<div class="trade">' + esc(t.time_ct || '') + ' ' + esc(t.action || '') + ' ' + esc(t.ticker || '') +
            (t.fill != null ? ' @ ' + esc(t.fill) : '') + (t.reason ? ' · ' + esc(t.reason) : '') + '</div>';
        }).join('') || '<span class="muted">—</span>';
        return '<tr><td>' + esc(b.rank == null ? '—' : b.rank) + '</td><td>' + esc(b.bot) + '</td>' +
          '<td class="num">' + money(b.balance_usd) + '</td>' +
          '<td class="num ' + cls + '">' + signed(b.pnl_usd) + '<br><span style="font-size:0.78rem">' + signed(b.pnl_pct, '%') + '</span></td>' +
          '<td>' + pos + '</td><td>' + trades + '</td><td class="num">' + money(b.fines_usd) + '</td></tr>';
      }).join('');
    }).catch(function () { document.getElementById('lb-meta').textContent = 'Leaderboard data is not available right now.'; });
  })();
  </script>
</body>
</html>
