<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive | AI, Finance, Tech: Scarcity & Abundance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e8e8e8;
      line-height: 1.6;
      padding: 2rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .back-link { color: #00d4ff; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: #8892b0; margin-bottom: 2rem; }
    .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 1rem; flex-wrap: wrap; }
    .tab { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #8892b0; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
    .tab:hover { background: rgba(255, 255, 255, 0.1); color: #e8e8e8; }
    .tab.active { background: rgba(0, 212, 255, 0.15); border-color: rgba(0, 212, 255, 0.4); color: #00d4ff; }
    .section { display: none; }
    .section.active { display: block; }
    .stats { display: flex; gap: 2rem; margin-bottom: 2rem; }
    .stat-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 1rem 1.5rem; border-radius: 8px; text-align: center; min-width: 120px; }
    .stat-number { font-size: 1.5rem; font-weight: 600; color: #00d4ff; }
    .stat-label { font-size: 0.8rem; color: #8892b0; margin-top: 0.25rem; }
    .insight-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; cursor: pointer; transition: all 0.2s; }
    .insight-item:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(0, 212, 255, 0.3); }
    .insight-item .source { font-size: 0.8rem; color: #00d4ff; margin-bottom: 0.5rem; }
    .insight-item .text { color: #e8e8e8; line-height: 1.6; margin-bottom: 0.75rem; }
    .insight-item .action-btn { background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.3); color: #00d4ff; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
    .insight-item .action-btn:hover { background: rgba(0, 212, 255, 0.2); }
    .empty-state { text-align: center; padding: 3rem; color: #8892b0; }

    /* Pundit archive cards */
    .pundit-archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .pundit-archive-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem; position: relative; }
    .pundit-archive-name { font-weight: 600; color: #00d4ff; margin-bottom: 0.25rem; }
    .pundit-archive-tagline { font-size: 0.85rem; color: #a8b2d1; margin-bottom: 0.4rem; }
    .pundit-archive-meta { font-size: 0.78rem; color: #9ca3af; }
    .pundit-archive-presence { position: absolute; top: 0.4rem; right: 0.6rem; font-size: 0.75rem; color: #8892b0; text-align: right; }
    .pundit-archive-presence-bar { width: 46px; height: 5px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; margin-top: 0.15rem; }
    .pundit-archive-presence-bar > span { display: block; height: 100%; background: linear-gradient(90deg, #00d4ff, #7b2cbf); }
    
    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 2rem; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: rgba(26, 26, 46, 0.98); border-radius: 16px; width: 100%; max-width: 900px; max-height: 85vh; overflow: hidden; border: 1px solid rgba(0, 212, 255, 0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(123, 44, 191, 0.1) 100%); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .modal-title { color: #00d4ff; font-size: 1.3rem; margin: 0; }
    .modal-source { font-size: 0.8rem; color: #8892b0; margin-top: 0.25rem; }
    .modal-close { background: none; border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    .modal-body { padding: 2rem; overflow-y: auto; max-height: calc(85vh - 80px); }
    .dd-section { margin-bottom: 2rem; }
    .dd-section h4 { color: #00d4ff; margin-bottom: 0.75rem; font-size: 1.1rem; }
    .dd-overview { background: rgba(0, 212, 255, 0.05); border-left: 3px solid #00d4ff; padding: 1.25rem; border-radius: 8px; margin-bottom: 2rem; }
    .dd-ticker { background: rgba(255, 255, 255, 0.03); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .dd-ticker-name { background: rgba(0, 212, 255, 0.2); color: #00d4ff; padding: 0.25rem 0.75rem; border-radius: 4px; font-weight: 600; font-size: 0.9rem; display: inline-block; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <h1>Archive</h1>
    <p class="subtitle">Historical insights and Overton Window terms (definitions + emerging concepts)</p>
    
    <div class="tabs">
      <div class="tab active" onclick="showTab('insights')">📰 Insights (<span id="insightsCount">0</span>)</div>
      <div class="tab" onclick="showTab('overton')">🪟 Overton Window (Definitions + Terms) (<span id="overtonCount">0</span>)</div>
      <div class="tab" onclick="showTab('pundits')">🎙️ Pundits (<span id="punditsCount">0</span>)</div>
    </div>
    
    <div class="stats">
      <div class="stat-box"><div class="stat-number" id="insightsStat">0</div><div class="stat-label">Insights</div></div>
      <div class="stat-box"><div class="stat-number" id="overtonStat">0</div><div class="stat-label">Overton Window Items</div></div>
      <div class="stat-box"><div class="stat-number" id="punditsStat">0</div><div class="stat-label">Pundits</div></div>
    </div>
    
    <div id="insightsSection" class="section active"></div>
    <div id="overtonSection" class="section"></div>
    <div id="punditsSection" class="section"></div>
  </div>

  <!-- Deep Dive Modal -->
  <div id="deepDiveModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h3 class="modal-title" id="modalTitle">Deep Dive</h3>
          <div class="modal-source" id="modalSource"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕ Close</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="./data/data.js?v=1785004619"></script>
  <script src="./js/common.js"></script>
  <script>
    // Archive data
    let archiveData = { insights: [], definitions: [], overton: [] };
    
    function formatDate(dateStr) {
      if (!dateStr) return 'Unknown date';
      const s = formatSiteCalendarDate(dateStr, { month: 'short', day: 'numeric', year: 'numeric' });
      return s === '—' ? String(dateStr) : s;
    }
    
    function loadData() {
      if (typeof dashboardData !== 'undefined' && dashboardData.archive) {
        archiveData = dashboardData.archive;
        console.log('✓ Loaded data:', archiveData);
        renderAll();
      } else {
        console.error('dashboardData not found');
        document.getElementById('insightsSection').innerHTML = '<div class="empty-state">Error loading data. Please refresh.</div>';
      }
    }
    
    function updateStats() {
      const insightsCount = archiveData.insights?.length || 0;
      const defCount = archiveData.definitions?.length || 0;
      const overtonCount = archiveData.overton?.length || 0;
      const combinedWindowCount = defCount + overtonCount;
      document.getElementById('insightsCount').textContent = insightsCount;
      document.getElementById('overtonCount').textContent = combinedWindowCount;
      document.getElementById('insightsStat').textContent = insightsCount;
      document.getElementById('overtonStat').textContent = combinedWindowCount;
      // Pundits count comes from dashboardData.pundits (site export); fall back to 0 if missing.
      let punditCount = 0;
      try {
        if (typeof dashboardData !== 'undefined' && Array.isArray(dashboardData.pundits)) {
          punditCount = dashboardData.pundits.length;
        }
      } catch (e) {}
      const pc = document.getElementById('punditsCount');
      const ps = document.getElementById('punditsStat');
      if (pc) pc.textContent = punditCount;
      if (ps) ps.textContent = punditCount;
    }
    
    function renderInsights() {
      const container = document.getElementById('insightsSection');
      const insights = archiveData.insights || [];
      
      if (insights.length === 0) {
        container.innerHTML = '<div class="empty-state">No insights available</div>';
        return;
      }
      
      container.innerHTML = insights.map(item => `
        <div class="insight-item">
          <div class="source">${item.source_name} • ${formatDate(item.source_date)}</div>
          <div class="text"><strong>${item.title}:</strong> ${item.key_takeaway || item.summary}</div>
          <button class="action-btn" onclick='openDeepDive(${JSON.stringify(item.title)}, ${JSON.stringify(item.source_name)}, ${JSON.stringify(item.source_date)})'>🔍 Deep Dive</button>
        </div>
      `).join('');
    }
    
    function renderOverton() {
      const container = document.getElementById('overtonSection');
      const definitions = archiveData.definitions || [];
      const terms = archiveData.overton || [];
      const combined = [
        // Definitions first
        ...definitions.map(item => ({
          term: item.term,
          text: item.definition
        })),
        // Then Overton terms
        ...terms.map(item => ({
          term: item.term,
          text: item.description
        }))
      ];
      
      if (combined.length === 0) {
        container.innerHTML = '<div class="empty-state">No Overton Window items available</div>';
        return;
      }
      
      container.innerHTML = combined.map(item => `
        <div class="insight-item">
          <div class="source">${item.term}</div>
          <div class="text">${item.text}</div>
        </div>
      `).join('');
    }
    
    function renderPundits() {
      const container = document.getElementById('punditsSection');
      if (!container) return;
      
      let items = [];
      try {
        if (typeof dashboardData !== 'undefined' && Array.isArray(dashboardData.pundits)) {
          items = dashboardData.pundits.slice(); // full list, already sorted by presence/recency from backend
        }
      } catch (e) {
        items = [];
      }
      
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">No pundits available yet.</div>';
        return;
      }
      
      const esc = (s) => String(s || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const dateOpts = { month: 'short', day: 'numeric', year: 'numeric' };
      
      const html = items.map(p => {
        const name = esc((p.name || 'Pundit').trim());
        const known = esc(p.known_for || '');
        const bio = esc(p.bio || '');
        const idea = esc(p.last_main_idea || '');
        const mentionScore = p.mention_score || p.appearance_count || 0;
        const decayed = (typeof p.mention_score_decayed === 'number') ? p.mention_score_decayed : mentionScore;
        const cap = 4.0;
        const norm = Math.max(0, Math.min(1, (decayed || 0) / cap));
        const presencePct = Math.max(0, Math.min(100, Math.round(norm * 100)));
        
        let src = '';
        if (p.last_podcast_name || p.last_episode_date) {
          const epDateStr = p.last_episode_date ? formatSiteCalendarDate(p.last_episode_date, dateOpts) : '';
          src = esc(p.last_podcast_name || '') + (epDateStr ? ' • ' + epDateStr : '');
        } else if (p.last_seen) {
          src = esc(String(p.last_seen).substring(0, 10));
        }
        const proofCite = esc(p.last_proof_cite || '');
        let proofSnip = esc(p.last_proof_snippet || '');
        if (proofSnip.length > 280) proofSnip = proofSnip.substring(0, 277) + '…';
        const arenaBits = [];
        if (mentionScore) arenaBits.push(mentionScore + '× guest spot' + (mentionScore === 1 ? '' : 's'));
        if (proofCite) arenaBits.push('Latest proof: ' + proofCite);
        else if (src) arenaBits.push('Latest: ' + src);
        const why = arenaBits.join(' · ');
        
        const tagline = known || bio;
        const thesis = idea
          ? `<div style="margin-top:0.35rem;"><span style="display:block;font-size:0.72rem;color:#8892b0;font-weight:600;margin-bottom:0.15rem;">Thesis (latest episode)</span><span style="color:#cbd5f5;">“${idea}”</span></div>`
          : '';
        const proofHtml = proofSnip
          ? `<div style="margin-top:0.35rem;font-size:0.78rem;color:#a8b2d1;font-style:italic;border-left:2px solid rgba(0,212,255,0.35);padding-left:0.45rem;">“${proofSnip}”</div>`
          : '';
        
        return `
          <div class="pundit-archive-card">
            <div class="pundit-archive-presence">
              <div>${presencePct}% presence</div>
              <div class="pundit-archive-presence-bar"><span style="width:${presencePct}%;"></span></div>
            </div>
            <div class="pundit-archive-name">${name}</div>
            <div class="pundit-archive-tagline">${tagline || ''}</div>
            <div class="pundit-archive-meta">
              ${why || 'No appearance history yet.'}<br/>
              ${proofHtml}
              ${thesis}
            </div>
          </div>
        `;
      }).join('');
      
      container.innerHTML = `<div class="pundit-archive-grid">${html}</div>`;
    }
    
    function renderAll() {
      updateStats();
      renderInsights();
      renderOverton();
      renderPundits();
    }
    
    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      // Use the global event target when called from onclick on the tab
      if (event && event.target) event.target.classList.add('active');
      document.getElementById(tab + 'Section').classList.add('active');
    }
    
    // Deep Dive Functions
    function openDeepDive(insightTitle, sourceName, sourceDate) {
      const modal = document.getElementById('deepDiveModal');
      const titleEl = document.getElementById('modalTitle');
      const sourceEl = document.getElementById('modalSource');
      const bodyEl = document.getElementById('modalBody');
      
      // Find matching Deep Dive by title
      let dd = null;
      if (typeof dashboardData !== 'undefined' && dashboardData.deepDives) {
        const allDD = Object.values(dashboardData.deepDives);
        dd = allDD.find(d => d.insight_title === insightTitle);
      }
      
      titleEl.textContent = insightTitle;
      sourceEl.textContent = `${sourceName} • ${formatDate(sourceDate)}`;
      
      if (dd) {
        bodyEl.innerHTML = generateDeepDiveHTML(dd);
      } else {
        bodyEl.innerHTML = '<div class="empty-state">No Deep Dive content available for this insight.</div>';
      }
      
      modal.classList.add('active');
    }
    
    function closeModal(event) {
      if (!event || event.target.id === 'deepDiveModal' || event.target.classList.contains('modal-close')) {
        document.getElementById('deepDiveModal').classList.remove('active');
      }
    }
    
    // Initialize
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadData);
    } else {
      loadData();
    }
  </script>
</body>
</html>
