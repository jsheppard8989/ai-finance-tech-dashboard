name: Market Data Refresh

# Refreshes the public-source market data files:
#   Compute Forward chart: fetch_gpu_index.py (6-month daily spot history) then
#   fetch_compute_curve.py (A100/H100/B200/H200 forwards + regenerates compute_outlook line)
#   in site/data/market_data.json, and
#   Liquidity Pulse ticker: fetch_liquidity_ticker.py in site/data/liquidity_ticker.json
#   (Treasury Calendar retired 2026-11-25; COT removed 2026-10-22; Curve Snapshot retired 2026-10-22).
# No secrets: all sources are public. Replaces the Mac launchd path for these
# (auto_pipeline.py skips them unless MARKET_DATA_FETCH_LOCAL=1).
#
# Cron is UTC. Two weekday runs at 9:00 AM and 3:15 PM CT, set for CST (UTC-6).
# During CDT (UTC-5, from Mar 8 2027) these fire at 10:00 AM / 4:15 PM CT; change them
# to "0 14 * * 1-5" and "15 20 * * 1-5" then.
# The "45 3 * * 2-6" entry is the separate nightly run (~9:45 PM CST after close).
on:
  schedule:
    - cron: "0 15 * * 1-5"    # 9:00 AM CST
    - cron: "15 21 * * 1-5"   # 3:15 PM CST (after-close market data)
    - cron: "45 3 * * 2-6"    # ~9:45 PM CST nightly liquidity ticker
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Chicago
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Compute Forward (GPU index)
        working-directory: pipeline
        continue-on-error: true
        run: python fetch_gpu_index.py

      - name: Fetch Compute Forward curve (Kalshi-implied, via AI Compute Tracker)
        working-directory: pipeline
        continue-on-error: true
        run: python fetch_compute_curve.py

      # Nightly slot (~9:45 PM CST) + manual dispatch: official closes for the 6-input Liquidity Pulse.
      # continue-on-error keeps any stale-marked fallback JSON committed rather than dropping the run.
      - name: Fetch Liquidity Ticker (6-input nightly close)
        id: liquidity_ticker
        if: github.event.schedule == '45 3 * * 2-6' || github.event_name == 'workflow_dispatch'
        working-directory: pipeline
        continue-on-error: true
        run: python fetch_liquidity_ticker.py

      # Trap Map retired Nov 5, 2026; its frozen archive is not refreshed or published.

      - name: Validate market JSON files
        if: ${{ !cancelled() }}
        run: |
          python -c "import json; json.load(open('site/data/market_data.json')); json.load(open('site/data/liquidity_ticker.json'))"

      - name: Commit via PR, merge, trigger Pages
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/data/market_data.json site/data/liquidity_ticker.json site/data/_raw/liquidity_ticker_history.csv; then
            echo "No market data change."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ts=$(date +%Y-%m-%d-%H%M)
          branch="data/market-data-${ts}"
          git checkout -b "$branch"
          git add -u -- site/data/market_data.json site/data/liquidity_ticker.json site/data/_raw/liquidity_ticker_history.csv
          git commit -m "Market data refresh ${ts} CT (Actions: GPU spot + forwards, Liquidity Ticker)"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch"             --title "Market data refresh ${ts} CT"             --body "Automated by .github/workflows/market-data.yml (run ${GITHUB_RUN_ID}).")
          gh pr merge "$url" --merge --delete-branch
          # Merges made with GITHUB_TOKEN don't fire push workflows; dispatch Pages.
          gh workflow run deploy.yml --ref main
          echo "Merged $url and dispatched deploy.yml"
